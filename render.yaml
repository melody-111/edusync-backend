services:
  - type: web
    name: digital-classroom-backend
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        value: https://your-frontend-domain.com
      # Database (Update with production MongoDB URI)
      - key: MONGODB_URI
        value: mongodb+srv://Divyansh:Divyansh@trial.qjmankx.mongodb.net/digital_classroom?retryWrites=true&w=majority
      # Redis (Upstash Cloud Serverless Redis)
      - key: REDIS_URL
        value: rediss://default:gQAAAAAAAlQ6AAIgcDIwMzAwYzhkNDVlN2I0ODUxYjUyZWQxNjdhM2YzYjdmMQ@mint-ostrich-152634.upstash.io:6379
      - key: REDIS_TLS
        value: "true"
      # JWT & Encryption Secrets
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: sudhanshu@edusync.com
      # OTP & QR Secrets
      - key: OTP_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        value: your_google_client_id
      - key: GOOGLE_CLIENT_SECRET
        value: your_google_client_secret
      - key: GOOGLE_CALLBACK_URL
        value: https://edusync-backend-application.onrender.com/auth/google/callback
      - key: TEACHER_APP_URL
        value: https://edu-sync-teacher-app.vercel.app
      # Email SMTP
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: "Digital Classroom <noreply@classroom.app>"
      # AI API
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o
      # YouTube API
      - key: YOUTUBE_API_KEY
        sync: false
      # Firebase (Push Notifications)
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: ./firebase-service-account.json
      # File Storage
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: PDF_STORAGE_DIR
        value: exports/pdfs
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
      # Socket.io
      - key: SOCKET_CORS_ORIGIN
        value: https://your-frontend-domain.com
      # Cloud Storage (Cloudinary)
      - key: CLOUD_STORAGE_ENABLED
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Twilio SMS
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      # Dev Mode (Disabled)
      - key: DEV_MODE
        value: "false"
      - key: DEV_OTP_BYPASS
        value: "false"
